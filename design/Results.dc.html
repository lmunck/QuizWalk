<!doctype html>
<html lang="en">

<title>Qualk – Results</title>

<x-dc>
<helmet>

<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#14502F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F1; font-family: Inter, system-ui, sans-serif; color: #16211B; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 16px 0; display: flex; align-items: center; justify-content: space-between">

      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16211B" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size: 14px; color: #4A5A50">Ended 16:48 · 4 teams</span>
    <span style="width: 44px"></span>
  </div>
  <div style="padding: 8px 24px 0; display: flex; flex-direction: column; gap: 18px; flex-grow: 1">

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <span style="width: 44px; height: 44px; border-radius: 22px; background: #7C3AED; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">HH</span>

        <div style="width: 100%; height: 84px; border-radius: 12px 12px 0 0; background: #DDE3D9; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">2</span>
          <span style="font-size: 13px; color: #4A5A50">88 pts</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <span style="width: 52px; height: 52px; border-radius: 26px; background: #1D4ED8; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">FK</span>
        <span style="font-size: 13px; font-weight: 600; text-align: center">Fjord Kids</span>
        <div style="width: 100%; height: 120px; border-radius: 12px 12px 0 0; background: {{accent}}; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">1</span>
          <span style="font-size: 13px">96 pts</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <span style="width: 44px; height: 44px; border-radius: 22px; background: #B4471B; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">MJ</span>
        <span style="font-size: 13px; font-weight: 600; text-align: center">Munck Jr.</span>
        <div style="width: 100%; height: 60px; border-radius: 12px 12px 0 0; background: #DDE3D9; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">3</span>
          <span style="font-size: 13px; color: #4A5A50">71 pts</span>
        </div>
      </div>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #C9D2C4; border-radius: 16px; padding: 4px 16px; display: flex; flex-direction: column">
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 50px; border-bottom: 1px solid #EEF1EB">
        <span style="font-size: 14px">4. Late Starters</span>
        <span style="font-size: 14px; font-weight: 600">38 pts · 5/8 stops</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 50px; border-bottom: 1px solid #EEF1EB">
        <span style="font-size: 14px">Hardest stop</span>
        <span style="font-size: 14px; font-weight: 600">3 · Nyhavn 20 (1 of 4 right)</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 50px; border-bottom: 1px solid #EEF1EB">
        <span style="font-size: 14px">Easiest stop</span>
        <span style="font-size: 14px; font-weight: 600">7 · Little Mermaid (4 of 4)</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 50px">
        <span style="font-size: 14px">Fastest finish</span>
        <span style="font-size: 14px; font-weight: 600">Fjord Kids · 47 min</span>
      </div>
    </div>
  </div>
  <div style="padding: 14px 24px 36px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <a href="Main.dc.html" style="height: 52px; border-radius: 26px; border: 1px solid #16211B; color: #16211B; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Reuse walk</a>
    <a href="Leaderboard.dc.html" style="height: 52px; border-radius: 26px; background: {{accent}}; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Share results</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F6F4A","options":["#1F6F4A","#1D4ED8","#B4471B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1F6F4A' };
  }
}
</script>

</html>
