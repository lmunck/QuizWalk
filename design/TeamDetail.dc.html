<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Qualk – Team detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#14502F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F1; font-family: Inter, system-ui, sans-serif; color: #16211B; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 16px 8px; display: flex; align-items: center; gap: 8px">
    <a href="Monitor.dc.html" aria-label="Back to live monitor" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16211B" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size: 17px; font-weight: 600">Team</span>
  </div>
  <div style="padding: 4px 24px 0; display: flex; flex-direction: column; gap: 18px; flex-grow: 1">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 56px; height: 56px; border-radius: 28px; background: #1D4ED8; color: #FFFFFF; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center">FK</span>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Fjord Kids</span>
        <span style="font-size: 14px; color: #4A5A50">3 players · started 14:06 · seen 1 min ago</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: #FFFFFF; border: 1px solid #C9D2C4; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #4A5A50">Score</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">62</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #C9D2C4; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #4A5A50">Correct</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">4/5</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #C9D2C4; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #4A5A50">Walked</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">1.9 km</span>
      </div>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #C9D2C4; border-radius: 16px; padding: 4px 16px; display: flex; flex-direction: column">
      <sc-for list="{{stops}}" as="s" hint-placeholder-count="8">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 46px; border-bottom: 1px solid #EEF1EB">
          <span style="{{s.dot}}">{{s.n}}</span>
          <span style="flex-grow: 1; font-size: 14px">{{s.q}}</span>
          <span style="{{s.resultStyle}}">{{s.result}}</span>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="padding: 14px 24px 36px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button style="height: 52px; border-radius: 26px; border: 1px solid #16211B; background: transparent; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; color: #16211B">Skip stop 6</button>
    <button style="height: 52px; border-radius: 26px; border: 0; background: {{accent}}; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; color: #FFFFFF">Message team</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F6F4A","options":["#1F6F4A","#1D4ED8","#B4471B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#1F6F4A';
    const rows = [
      ['Old Stock Exchange spire', 'ok', '+14'],
      ['Holmen naval base', 'ok', '+12'],
      ['Nyhavn 20 resident', 'miss', '0'],
      ['Nyhavn canal', 'ok', '+14'],
      ['Christianshavn origins', 'ok', '+12'],
      ['The Opera', 'now', '140 m away'],
      ['The Little Mermaid', 'locked', 'locked'],
      ['Inderhavn bridge', 'locked', 'locked']
    ];
    const stops = rows.map((r, i) => {
      const st = r[1];
      const bg = st === 'ok' ? accent : st === 'miss' ? '#B4471B' : st === 'now' ? '#FFFFFF' : '#E3E8DF';
      const col = st === 'ok' || st === 'miss' ? '#FFFFFF' : st === 'now' ? accent : '#6B7A71';
      const border = st === 'now' ? '2px solid ' + accent : '2px solid transparent';
      return {
        n: i + 1,
        q: r[0],
        result: r[2],
        dot: 'width: 26px; height: 26px; flex-shrink: 0; box-sizing: border-box; border-radius: 13px; background: ' + bg + '; border: ' + border + '; color: ' + col + '; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center',
        resultStyle: 'font-size: 13px; font-weight: 600; color: ' + (st === 'ok' ? '#1F6F4A' : st === 'miss' ? '#93391A' : '#4A5A50')
      };
    });
    return { accent, stops };
  }
}
</script>
</body>
</html>
