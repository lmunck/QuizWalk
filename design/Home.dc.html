<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Qualk – My walks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#14502F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F1; font-family: Inter, system-ui, sans-serif; color: #16211B; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 56px 24px 8px; display: flex; justify-content: space-between; align-items: center">
    <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.5px">qualk</div>
    <div style="display: flex; gap: 8px">
      <a href="Join.dc.html" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C9D2C4; background: #FFFFFF; color: #16211B; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center">Join with code</a>
      <button aria-label="Profile" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #C9D2C4; background: #FFFFFF; font-family: Inter, sans-serif; font-weight: 600; font-size: 15px; color: #16211B">AM</button>
    </div>
  </div>
  <div style="padding: 16px 24px 0; display: flex; flex-direction: column; gap: 24px; flex-grow: 1">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; line-height: 1.1; letter-spacing: -0.8px">My walks</h1>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 600; color: #4A5A50; letter-spacing: 0.5px">LIVE NOW</span>
      <a href="Monitor.dc.html" style="background: #16211B; color: #FFFFFF; text-decoration: none; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
        <span style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Harbour history</span>
          <span style="height: 26px; padding: 0 10px; border-radius: 13px; background: #C2410C; font-size: 12px; font-weight: 600; display: flex; align-items: center">LIVE</span>
        </span>
        <span style="font-size: 14px; color: #B9C7BE">4 teams walking · ends 17:00 · 3.2 km</span>
        <span style="height: 6px; border-radius: 3px; background: #2E4136; display: block; overflow: hidden"><span style="display: block; height: 6px; width: 52%; background: {{accent}}"></span></span>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 600; color: #4A5A50; letter-spacing: 0.5px">DRAFTS</span>
      <a href="Route.dc.html" style="background: #FFFFFF; border: 1px solid #C9D2C4; color: #16211B; text-decoration: none; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
        <span style="width: 44px; height: 44px; border-radius: 12px; background: #E2F0E7; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>
        </span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 600">Kastellet kids' trail</span>
          <span style="font-size: 13px; color: #4A5A50">6 stops · 1.8 km · edited yesterday</span>
        </span>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 600; color: #4A5A50; letter-spacing: 0.5px">FINISHED</span>
      <a href="Results.dc.html" style="background: #FFFFFF; border: 1px solid #C9D2C4; color: #16211B; text-decoration: none; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
        <span style="width: 44px; height: 44px; border-radius: 12px; background: #FBF1EB; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4471B" stroke-width="2" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path></svg>
        </span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 600">Office summer walk</span>
          <span style="font-size: 13px; color: #4A5A50">12 teams · won by Team Kernel</span>
        </span>
      </a>
    </div>
  </div>
  <div style="padding: 16px 24px 40px">
    <a href="Main.dc.html" style="height: 56px; border-radius: 28px; background: {{accent}}; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; font-size: 17px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      New quiz walk
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F6F4A","options":["#1F6F4A","#1D4ED8","#B4471B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1F6F4A' };
  }
}
</script>
</body>
</html>
