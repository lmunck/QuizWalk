<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Qualk – Lobby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#14502F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #E4EAE0; font-family: Inter, system-ui, sans-serif; color: #16211B; overflow: hidden">
  <svg width="390" height="360" viewBox="0 0 390 360" role="img" aria-label="Map showing you 220 metres from the start point" style="position: absolute; left: 0; top: 0">
    <rect width="390" height="360" fill="#E4EAE0"></rect>
    <path d="M0 280 C90 250 150 300 230 285 S350 255 390 270 L390 360 L0 360 Z" fill="#BCD5E4"></path>
    <path d="M250 80 C310 70 360 120 345 170 C330 210 270 205 250 175 C230 140 220 95 250 80 Z" fill="#CBE0C0"></path>
    <g stroke="#FFFFFF" stroke-width="10" fill="none"><path d="M0 150 L390 140"></path><path d="M150 0 L170 280"></path><path d="M0 230 L390 238"></path></g>
    <path d="M90 236 L164 232 L170 186" fill="none" stroke="#1D4ED8" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"></path>
    <circle cx="90" cy="236" r="22" fill="#1D4ED8" fill-opacity="0.18"></circle>
    <circle cx="90" cy="236" r="9" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="3"></circle>
    <circle cx="170" cy="180" r="18" fill="#16211B"></circle>
    <text x="170" y="185" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">S</text>
  </svg>
  <div style="position: absolute; left: 16px; top: 52px">
    <a href="Join.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16211B" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 520px; background: #F4F6F1; border-radius: 24px 24px 0 0; padding: 24px 24px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; font-weight: 600; color: #4A5A50">YOU'RE IN · FJORD KIDS</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.4px">Head to the start</span>
      <span style="font-size: 15px; color: #4A5A50">Nyhavn 17 · 220 m away · stops reveal one at a time</span>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #C9D2C4; border-radius: 16px; padding: 6px 16px; display: flex; flex-direction: column">
      <div style="display: flex; gap: 12px; align-items: center; min-height: 48px; border-bottom: 1px solid #EEF1EB">
        <span style="width: 24px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: {{accent}}">1</span>
        <span style="font-size: 14px">Walk to the next stop on the map</span>
      </div>
      <div style="display: flex; gap: 12px; align-items: center; min-height: 48px; border-bottom: 1px solid #EEF1EB">
        <span style="width: 24px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: {{accent}}">2</span>
        <span style="font-size: 14px">The question opens within 25 m</span>
      </div>
      <div style="display: flex; gap: 12px; align-items: center; min-height: 48px">
        <span style="width: 24px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: {{accent}}">3</span>
        <span style="font-size: 14px">Answer fast for a speed bonus</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: #4A5A50">3 OTHER TEAMS JOINED</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #C9D2C4; font-size: 13px; display: flex; align-items: center">Harbour Hawks</span>
        <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #C9D2C4; font-size: 13px; display: flex; align-items: center">Munck Jr.</span>
        <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #C9D2C4; font-size: 13px; display: flex; align-items: center">Late Starters</span>
      </div>
    </div>
    <div style="flex-grow: 1"></div>
    <a href="Walk.dc.html" style="height: 56px; border-radius: 28px; background: {{accent}}; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px">Start walk</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F6F4A","options":["#1F6F4A","#1D4ED8","#B4471B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1F6F4A' };
  }
}
</script>
</body>
</html>
