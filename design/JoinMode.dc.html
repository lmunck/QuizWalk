<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Qualk – How are you playing?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#14502F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F1; font-family: Inter, system-ui, sans-serif; color: #16211B; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: #16211B; color: #FFFFFF; padding: 56px 24px 24px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; color: #B9C7BE">Harbour history · code K7·2QX</span>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; line-height: 1.1; letter-spacing: -0.6px">How are you playing?</h1>
  </div>
  <div style="padding: 20px 24px 0; display: flex; flex-direction: column; gap: 10px; flex-grow: 1">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
      <button onClick="{{m.pick}}" style="{{m.style}}">
        <span style="display: flex; flex-direction: column; gap: 2px; text-align: left; flex-grow: 1">
          <span style="font-size: 16px; font-weight: 600">{{m.title}}</span>
          <span style="font-size: 13px; color: #4A5A50">{{m.sub}}</span>
        </span>
        <span style="{{m.radio}}"></span>
      </button>
    </sc-for>
    <sc-if value="{{showTeams}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 8px">
        <span style="font-size: 13px; font-weight: 600; color: #4A5A50">TEAMS YOU CAN JOIN</span>
        <div style="background: #FFFFFF; border: 1px solid #C9D2C4; border-radius: 14px; padding: 4px 16px; display: flex; flex-direction: column">
          <div style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; border-bottom: 1px solid #EEF1EB">
            <span style="font-size: 15px; font-weight: 600">Harbour Hawks</span>
            <span style="font-size: 13px; color: #4A5A50">2 phones · 4 players</span>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; min-height: 52px">
            <span style="font-size: 15px; font-weight: 600">Munck Jr.</span>
            <span style="font-size: 13px; color: #4A5A50">1 phone · 2 players</span>
          </div>
        </div>
        <span style="font-size: 13px; line-height: 1.4; color: #4A5A50">The first answer from any phone counts for the whole team.</span>
      </div>
    </sc-if>
  </div>
  <div style="padding: 16px 24px 36px">
    <a href="Join.dc.html" style="height: 56px; border-radius: 28px; background: {{accent}}; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px">Continue</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F6F4A","options":["#1F6F4A","#1D4ED8","#B4471B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'team' }; }
  renderVals() {
    const accent = this.props.accent ?? '#1F6F4A';
    const defs = [
      { id: 'team', title: 'New team', sub: 'One phone for the group – the usual way' },
      { id: 'join', title: 'Join a team', sub: 'Add this phone to a team that already joined' },
      { id: 'solo', title: 'Solo', sub: 'Just me, on my own score' }
    ];
    const modes = defs.map((d) => {
      const on = d.id === this.state.mode;
      return {
        ...d,
        style: 'min-height: 72px; width: 100%; box-sizing: border-box; padding: 12px 16px; border-radius: 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-family: Inter, sans-serif; color: #16211B; ' + (on ? 'background: #E2F0E7; border: 2px solid ' + accent + ';' : 'background: #FFFFFF; border: 1px solid #C9D2C4;'),
        radio: 'width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 11px; ' + (on ? 'border: 7px solid ' + accent + '; background: #FFFFFF;' : 'border: 2px solid #8FA197;'),
        pick: () => this.setState({ mode: d.id })
      };
    });
    return { accent, modes, showTeams: this.state.mode === 'join' };
  }
}
</script>
</body>
</html>
