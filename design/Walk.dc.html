<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Qualk – Walking to next stop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#14502F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #E4EAE0; font-family: Inter, system-ui, sans-serif; color: #16211B; overflow: hidden">
  <svg width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Map showing your position and stop 4, 140 metres ahead" style="position: absolute; left: 0; top: 0">
    <rect width="390" height="844" fill="#E4EAE0"></rect>
    <path d="M0 640 C90 600 160 680 240 650 S350 610 390 630 L390 844 L0 844 Z" fill="#BCD5E4"></path>
    <path d="M250 180 C320 170 370 230 350 300 C330 350 270 340 250 300 C230 260 210 200 250 180 Z" fill="#CBE0C0"></path>
    <g stroke="#FFFFFF" stroke-width="14" fill="none" stroke-linecap="round">
      <path d="M0 420 L390 400"></path><path d="M150 0 L170 640"></path><path d="M0 230 L390 250"></path>
    </g>
    <g stroke="#FFFFFF" stroke-width="6" fill="none"><path d="M60 0 L80 640"></path><path d="M280 380 L300 640"></path><path d="M0 520 L390 510"></path></g>
    <path d="M168 560 L162 412 L156 250 L232 244" fill="none" stroke="{{accent}}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
    <circle cx="232" cy="244" r="60" fill="{{accent}}" fill-opacity="0.12" stroke="{{accent}}" stroke-dasharray="4 6"></circle>
    <circle cx="232" cy="244" r="18" fill="{{accent}}"></circle>
    <text x="232" y="250" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle">4</text>
    <circle cx="168" cy="560" r="26" fill="#1D4ED8" fill-opacity="0.18"></circle>
    <circle cx="168" cy="560" r="10" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="3"></circle>
  </svg>
  <div style="position: absolute; left: 16px; right: 16px; top: 52px; background: #FFFFFF; border-radius: 18px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 14px; font-weight: 600">Harbour history</span>
      <span style="font-size: 14px; color: #4A5A50">Stop 4 of 8 · 30 pts</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px">
      <div style="height: 6px; border-radius: 3px; background: {{accent}}"></div>
      <div style="height: 6px; border-radius: 3px; background: {{accent}}"></div>
      <div style="height: 6px; border-radius: 3px; background: #B4471B"></div>
      <div style="height: 6px; border-radius: 3px; background: #8FA197"></div>
      <div style="height: 6px; border-radius: 3px; background: #DDE3D9"></div>
      <div style="height: 6px; border-radius: 3px; background: #DDE3D9"></div>
      <div style="height: 6px; border-radius: 3px; background: #DDE3D9"></div>
      <div style="height: 6px; border-radius: 3px; background: #DDE3D9"></div>
    </div>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 32px; background: #16211B; color: #FFFFFF; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px">

      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; line-height: 1">140 m</span>
        <span style="font-size: 14px; color: #B9C7BE">to stop 4 · about 2 min</span>
      </div>
    </div>
    <span style="font-size: 14px; color: #D5DED8; line-height: 1.4">The question unlocks when you're within 25 m. You'll get a buzz – keep the phone in your pocket.</span>
    <div style="display: flex; gap: 10px">
      <a href="CantReach.dc.html" style="flex-grow: 1; height: 48px; border-radius: 24px; border: 1px solid #4A5A50; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px">Can't reach it</a>
      <a href="Question.dc.html" style="flex-grow: 1; height: 48px; border-radius: 24px; background: #FFFFFF; color: #16211B; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Simulate arrive</a>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F6F4A","options":["#1F6F4A","#1D4ED8","#B4471B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1F6F4A' };
  }
}
</script>
</body>
</html>
