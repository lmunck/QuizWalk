<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Qualk – Route builder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#14502F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #E4EAE0; font-family: Inter, system-ui, sans-serif; color: #16211B; overflow: hidden">
  <svg width="390" height="520" viewBox="0 0 390 520" role="img" aria-label="Map of a 3.2 km loop with 8 numbered stops" style="position: absolute; left: 0; top: 0">
    <rect width="390" height="520" fill="#E4EAE0"></rect>
    <path d="M0 330 C80 300 120 360 200 340 S330 300 390 320 L390 520 L0 520 Z" fill="#BCD5E4"></path>
    <path d="M220 60 C290 40 350 90 340 150 C330 200 260 210 230 170 C200 130 180 80 220 60 Z" fill="#CBE0C0"></path>
    <g stroke="#FFFFFF" stroke-width="9" fill="none" stroke-linecap="round">
      <path d="M0 120 L390 100"></path><path d="M0 230 L390 250"></path><path d="M90 0 L120 330"></path><path d="M200 0 L190 330"></path><path d="M300 210 L360 320"></path>
    </g>
    <g stroke="#FFFFFF" stroke-width="4" fill="none">
      <path d="M0 175 L390 180"></path><path d="M40 60 L60 320"></path><path d="M150 0 L150 330"></path><path d="M260 0 L250 320"></path>
    </g>
    <path d="M108 300 L104 228 L96 118 L148 112 L200 108 L235 175 L300 210 L330 270 L250 300 L190 318 Z" fill="none" stroke="{{accent}}" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round" stroke-linejoin="round"></path>
    <g font-family="Space Grotesk, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
      <circle cx="108" cy="300" r="16" fill="#16211B"></circle><text x="108" y="305" fill="#FFFFFF">S</text>
      <circle cx="104" cy="228" r="14" fill="{{accent}}"></circle><text x="104" y="233" fill="#FFFFFF">1</text>
      <circle cx="96" cy="118" r="14" fill="{{accent}}"></circle><text x="96" y="123" fill="#FFFFFF">2</text>
      <circle cx="148" cy="112" r="14" fill="{{accent}}"></circle><text x="148" y="117" fill="#FFFFFF">3</text>
      <circle cx="200" cy="108" r="14" fill="{{accent}}"></circle><text x="200" y="113" fill="#FFFFFF">4</text>
      <circle cx="235" cy="175" r="14" fill="{{accent}}"></circle><text x="235" y="180" fill="#FFFFFF">5</text>
      <circle cx="300" cy="210" r="14" fill="{{accent}}"></circle><text x="300" y="215" fill="#FFFFFF">6</text>
      <circle cx="330" cy="270" r="18" fill="#FFFFFF" stroke="#B4471B" stroke-width="3"></circle><text x="330" y="275" fill="#B4471B">7</text>
      <circle cx="250" cy="300" r="14" fill="{{accent}}"></circle><text x="250" y="305" fill="#FFFFFF">8</text>
    </g>
  </svg>
  <div style="position: absolute; left: 16px; right: 16px; top: 52px; display: flex; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16211B" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; gap: 8px">
    <a href="AddStop.dc.html" style="height: 44px; padding: 0 16px; border-radius: 22px; background: #FFFFFF; color: #16211B; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center">+ Add stop</a>
    <button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; color: #16211B; display: flex; align-items: center; gap: 8px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16211B" stroke-width="2" aria-hidden="true"><path d="M4 4v6h6"></path><path d="M20 12a8 8 0 0 1-14.9 4M4 10a8 8 0 0 1 14.9-2"></path></svg>
      New route
    </button>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 380px; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: #C9D2C4; align-self: center"></div>
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Harbour history</span>
        <span style="font-size: 14px; color: #4A5A50">3.2 km · ~45 min walk · loop</span>
      </div>
      <span style="font-size: 13px; font-weight: 600; color: #1F6F4A">Walkable ✓</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 0">
      <div style="display: flex; gap: 12px; align-items: center; min-height: 52px; border-bottom: 1px solid #E3E8DF">
        <span style="width: 28px; height: 28px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">6</span>
        <span style="flex-grow: 1; font-size: 15px">Which year did the Opera open?</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A877F" stroke-width="2" aria-hidden="true"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"></path></svg>
      </div>
      <a href="StopEdit.dc.html" style="color: #16211B; text-decoration: none; display: flex; gap: 12px; align-items: center; min-height: 64px; border-bottom: 1px solid #E3E8DF; background: #FBF1EB; margin: 0 -20px; padding: 0 20px">
        <span style="width: 28px; height: 28px; border-radius: 14px; background: #FFFFFF; border: 2px solid #B4471B; box-sizing: border-box; color: #B4471B; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">7</span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px">When was the Little Mermaid unveiled?</span>
          <span style="font-size: 12px; color: #93391A">Pin is on water – tap to fix</span>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A877F" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <div style="display: flex; gap: 12px; align-items: center; min-height: 52px">
        <span style="width: 28px; height: 28px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">8</span>
        <span style="flex-grow: 1; font-size: 15px">Who designed the Inderhavn bridge?</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A877F" stroke-width="2" aria-hidden="true"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"></path></svg>
      </div>
    </div>
    <div style="flex-grow: 1"></div>
    <a href="Share.dc.html" style="height: 56px; border-radius: 28px; background: {{accent}}; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px">Publish &amp; share</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F6F4A","options":["#1F6F4A","#1D4ED8","#B4471B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1F6F4A' };
  }
}
</script>
</body>
</html>
