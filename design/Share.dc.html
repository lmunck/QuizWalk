<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Qualk – Share</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#14502F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F1; font-family: Inter, system-ui, sans-serif; color: #16211B; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 16px 8px; display: flex; align-items: center; gap: 8px">
    <a href="Route.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16211B" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size: 17px; font-weight: 600">Share walk</span>
  </div>
  <div style="padding: 8px 24px 0; display: flex; flex-direction: column; gap: 20px; flex-grow: 1">
    <div style="background: #16211B; color: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <span style="font-size: 13px; font-weight: 600; color: #B9C7BE; letter-spacing: 1px">JOIN CODE</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 700; letter-spacing: 6px">K7·2QX</span>
      <div style="width: 168px; height: 168px; border-radius: 16px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#16211B" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"></path></svg>
        <span style="font-size: 12px; color: #4A5A50">[QR code]</span>
      </div>
      <span style="font-size: 13px; color: #B9C7BE">qualk.app/j/K72QX · opens in app or browser</span>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #C9D2C4; border-radius: 14px; padding: 4px 16px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; border-bottom: 1px solid #E3E8DF">
        <span style="font-size: 15px">Play as</span>
        <span style="font-size: 15px; font-weight: 600">Teams of up to 4</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; border-bottom: 1px solid #E3E8DF">
        <span style="font-size: 15px">Open</span>
        <span style="font-size: 15px; font-weight: 600">Sat 14:00 – 17:00</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; border-bottom: 1px solid #E3E8DF">
        <span style="font-size: 15px">Order</span>
        <span style="font-size: 15px; font-weight: 600">Fixed (1 → 8)</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 52px">
        <span style="font-size: 15px">Score</span>
        <span style="font-size: 15px; font-weight: 600">Correct + speed bonus</span>
      </div>
    </div>
  </div>
  <div style="padding: 16px 24px 40px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <button style="height: 56px; border-radius: 28px; border: 1px solid #16211B; background: transparent; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600; color: #16211B">Copy link</button>
    <a href="Monitor.dc.html" style="height: 56px; border-radius: 28px; background: {{accent}}; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">Send invite</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F6F4A","options":["#1F6F4A","#1D4ED8","#B4471B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1F6F4A' };
  }
}
</script>
</body>
</html>
