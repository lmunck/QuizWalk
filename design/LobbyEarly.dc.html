<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Qualk – Walk opens soon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#14502F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F1; font-family: Inter, system-ui, sans-serif; color: #16211B; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 16px 0">
    <a href="Join.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16211B" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
  </div>
  <div style="padding: 8px 24px 0; display: flex; flex-direction: column; gap: 20px; flex-grow: 1">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #4A5A50">YOU'RE ON THE LIST · FJORD KIDS</span>
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; line-height: 1.1; letter-spacing: -0.6px">Harbour history opens soon</h1>
    </div>
    <div style="background: #16211B; color: #FFFFFF; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span style="font-size: 13px; color: #B9C7BE; letter-spacing: 1px">OPENS IN</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 52px; font-weight: 700; letter-spacing: 1px; font-variant-numeric: tabular-nums">{{countdown}}</span>
      <span style="font-size: 14px; color: #B9C7BE">Saturday 14:00 – 17:00</span>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #C9D2C4; border-radius: 14px; padding: 0 16px; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <span style="font-size: 15px">Notify me when it opens</span>
      <button onClick="{{toggle}}" role="switch" aria-checked="{{notifyAria}}" aria-label="Notify me when it opens" style="{{switchStyle}}"><span style="{{knobStyle}}"></span></button>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #C9D2C4; border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" aria-hidden="true" style="flex-shrink: 0"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 600">Meanwhile, head to the start</span>
        <span style="font-size: 13px; color: #4A5A50">Nyhavn 17 · 1.4 km · about 18 min</span>
      </span>
    </div>
  </div>
  <div style="padding: 16px 24px 36px; display: flex; flex-direction: column; gap: 8px">
    <div aria-disabled="true" style="height: 56px; border-radius: 28px; background: #DDE3D9; color: #4A5A50; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">Start unlocks at 14:00</div>
    <a href="Lobby.dc.html" style="display: block; text-align: center; padding-top: 6px; font-size: 13px; color: #4A5A50">Prototype: skip to opening</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F6F4A","options":["#1F6F4A","#1D4ED8","#B4471B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { left: 4360, notify: true }; }
  componentDidMount() { this.timer = setInterval(() => this.setState({ left: Math.max(0, this.state.left - 1) }), 1000); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const accent = this.props.accent ?? '#1F6F4A';
    const s = this.state.left;
    const pad = (n) => String(n).padStart(2, '0');
    const on = this.state.notify;
    return {
      accent,
      countdown: Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60),
      toggle: () => this.setState({ notify: !this.state.notify }),
      notifyAria: on ? 'true' : 'false',
      switchStyle: 'width: 52px; height: 32px; flex-shrink: 0; border: 0; border-radius: 16px; padding: 3px; cursor: pointer; display: flex; justify-content: ' + (on ? 'flex-end' : 'flex-start') + '; background: ' + (on ? accent : '#C9D2C4'),
      knobStyle: 'width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; display: block'
    };
  }
}
</script>
</body>
</html>
