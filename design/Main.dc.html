<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Qualk – Create quiz</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#14502F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F1; font-family: Inter, system-ui, sans-serif; color: #16211B; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 56px 24px 16px; display: flex; justify-content: space-between; align-items: center">
    <a href="Home.dc.html" aria-label="Back to my walks" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #C9D2C4; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16211B" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size: 14px; color: #4A5A50">Draft · autosaved</span>
  </div>
  <div style="padding: 8px 24px 0; display: flex; flex-direction: column; gap: 20px; flex-grow: 1">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; line-height: 1.1; letter-spacing: -0.8px">New quiz walk</h1>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="topic" style="font-size: 13px; font-weight: 600; color: #4A5A50">Topic or prompt</label>
      <textarea id="topic" style="height: 84px; box-sizing: border-box; padding: 14px; border-radius: 14px; border: 1px solid #C9D2C4; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 16px; color: #16211B; resize: none">History of Copenhagen harbour, family-friendly</textarea>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="background: #FFFFFF; border: 1px solid #C9D2C4; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; font-weight: 600; color: #4A5A50">Questions</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">8</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #C9D2C4; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; font-weight: 600; color: #4A5A50">Walk length</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">~3 km</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: #4A5A50">Difficulty</span>
      <div role="radiogroup" aria-label="Difficulty" style="display: flex; gap: 8px">
        <button style="flex-grow: 1; height: 44px; border-radius: 22px; border: 1px solid #C9D2C4; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 15px; color: #16211B">Kids</button>
        <button style="flex-grow: 1; height: 44px; border-radius: 22px; border: 0; background: #16211B; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; color: #FFFFFF">Mixed</button>
        <button style="flex-grow: 1; height: 44px; border-radius: 22px; border: 1px solid #C9D2C4; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 15px; color: #16211B">Expert</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: #4A5A50">Start &amp; shape</span>
      <div style="background: #FFFFFF; border: 1px solid #C9D2C4; border-radius: 14px; padding: 4px 14px; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 12px; height: 52px; border-bottom: 1px solid #E3E8DF">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
          <span style="flex-grow: 1; font-size: 15px">Nyhavn 17 (my location)</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; height: 52px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" aria-hidden="true"><path d="M4 12a8 8 0 1 0 8-8"></path><path d="M12 4l-3-2M12 4l-3 2"></path></svg>
          <span style="flex-grow: 1; font-size: 15px">Loop back to start</span>
          <span style="font-size: 13px; color: #4A5A50">Change</span>
        </div>
      </div>
    </div>
  </div>
  <div style="padding: 16px 24px 40px; display: flex; flex-direction: column; gap: 10px">
    <a href="Generating.dc.html" style="height: 56px; border-radius: 28px; background: {{accent}}; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; font-size: 17px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>
      Generate questions &amp; route
    </a>
    <span style="text-align: center; font-size: 13px; color: #4A5A50">or <a href="#">write questions yourself</a></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F6F4A","options":["#1F6F4A","#1D4ED8","#B4471B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1F6F4A' };
  }
}
</script>
</body>
</html>
