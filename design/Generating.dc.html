<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Qualk – Generating walk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#14502F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F1; font-family: Inter, system-ui, sans-serif; color: #16211B; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 16px 8px; display: flex; align-items: center; gap: 8px">
    <a href="Main.dc.html" aria-label="Cancel and go back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16211B" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </div>
  <div style="padding: 8px 24px 0; display: flex; flex-direction: column; gap: 28px; flex-grow: 1">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; line-height: 1.1; letter-spacing: -0.6px">{{headline}}</h1>
      <span style="font-size: 15px; color: #4A5A50">Harbour history · 8 questions · ~3 km loop from Nyhavn 17</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; gap: 14px; align-items: flex-start; padding: 12px 0">
          <span style="{{s.dot}}">{{s.icon}}</span>
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="{{s.labelStyle}}">{{s.label}}</span>
            <span style="font-size: 13px; color: #4A5A50">{{s.detail}}</span>
          </span>
        </div>
      </sc-for>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #C9D2C4; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; color: #4A5A50; letter-spacing: 0.5px">LATEST QUESTION · STOP 5</span>
      <span style="font-size: 16px; line-height: 1.4">Christian IV founded Christianshavn in 1617. What was it first planned as?</span>
      <span style="font-size: 13px; color: #4A5A50">Source: Wikipedia · Christianshavn</span>
    </div>
  </div>
  <div style="padding: 16px 24px 40px">
    <sc-if value="{{done}}" hint-placeholder-val="{{ true }}">
      <a href="Route.dc.html" style="height: 56px; border-radius: 28px; background: {{accent}}; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px">Review route &amp; questions</a>
    </sc-if>
    <sc-if value="{{working}}" hint-placeholder-val="{{ false }}">
      <div style="height: 56px; border-radius: 28px; background: #DDE3D9; color: #4A5A50; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">Usually takes 20–40 seconds</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F6F4A","options":["#1F6F4A","#1D4ED8","#B4471B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 0 }; }
  componentDidMount() {
    this.timer = setInterval(() => {
      if (this.state.step >= 4) { clearInterval(this.timer); return; }
      this.setState({ step: this.state.step + 1 });
    }, 1100);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const accent = this.props.accent ?? '#1F6F4A';
    const step = this.state.step;
    const defs = [
      { label: 'Finding places', detail: '23 points of interest within 1.5 km' },
      { label: 'Building a walkable loop', detail: '8 stops · 3.2 km · pins snapped to paths' },
      { label: 'Writing questions', detail: 'Grounded in each place’s history' },
      { label: 'Fact-checking', detail: 'Second pass verifies answers against sources' }
    ];
    const steps = defs.map((d, i) => {
      const state = i < step ? 'done' : (i === step ? 'active' : 'todo');
      const bg = state === 'done' ? accent : (state === 'active' ? '#FFFFFF' : '#E3E8DF');
      const border = state === 'active' ? '2px solid ' + accent : '2px solid transparent';
      const color = state === 'done' ? '#FFFFFF' : accent;
      return {
        ...d,
        icon: state === 'done' ? '✓' : String(i + 1),
        dot: 'width: 28px; height: 28px; flex-shrink: 0; border-radius: 14px; box-sizing: border-box; background: ' + bg + '; border: ' + border + '; color: ' + color + '; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center',
        labelStyle: 'font-size: 16px; font-weight: ' + (state === 'todo' ? '500' : '600') + '; color: ' + (state === 'todo' ? '#6B7A71' : '#16211B')
      };
    });
    const done = step >= 4;
    return { accent, steps, done, working: !done, headline: done ? 'Your walk is ready' : 'Building your walk…' };
  }
}
</script>
</body>
</html>
