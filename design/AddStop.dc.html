<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Qualk – Add a stop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#14502F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #E4EAE0; font-family: Inter, system-ui, sans-serif; color: #16211B; overflow: hidden">
  <svg width="390" height="440" viewBox="0 0 390 440" role="img" aria-label="Map with a new stop dropped between stops 5 and 6" style="position: absolute; left: 0; top: 0">
    <rect width="390" height="440" fill="#E4EAE0"></rect>
    <path d="M0 330 C80 300 120 360 200 340 S330 300 390 320 L390 440 L0 440 Z" fill="#BCD5E4"></path>
    <g stroke="#FFFFFF" stroke-width="9" fill="none"><path d="M0 170 L390 160"></path><path d="M0 260 L390 270"></path><path d="M120 0 L135 330"></path><path d="M260 0 L250 330"></path></g>
    <path d="M70 200 L150 190 L196 228 L300 230" fill="none" stroke="{{accent}}" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"></path>
    <path d="M150 190 L300 230" fill="none" stroke="#8FA197" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"></path>
    <g font-family="Space Grotesk, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
      <circle cx="70" cy="200" r="14" fill="{{accent}}"></circle><text x="70" y="205" fill="#FFFFFF">4</text>
      <circle cx="150" cy="190" r="14" fill="{{accent}}"></circle><text x="150" y="195" fill="#FFFFFF">5</text>
      <circle cx="300" cy="230" r="14" fill="{{accent}}"></circle><text x="300" y="235" fill="#FFFFFF">6</text>
      <circle cx="196" cy="228" r="40" fill="#B4471B" fill-opacity="0.12" stroke="#B4471B" stroke-dasharray="4 5"></circle>
      <circle cx="196" cy="228" r="17" fill="#B4471B" stroke="#FFFFFF" stroke-width="3"></circle><text x="196" y="233" fill="#FFFFFF">+</text>
    </g>
  </svg>
  <div style="position: absolute; left: 16px; right: 16px; top: 52px; display: flex; gap: 8px">
    <a href="Route.dc.html" aria-label="Cancel" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16211B" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <label style="flex-grow: 1; height: 48px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 16px; box-sizing: border-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5A50" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input aria-label="Search a place" placeholder="Search a place, or long-press the map" style="border: 0; outline: none; flex-grow: 1; min-width: 0; font-family: Inter, sans-serif; font-size: 15px; color: #16211B; background: transparent">
    </label>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 430px; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: #C9D2C4; align-self: center"></div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Gammel Strand</span>
      <span style="font-size: 14px; color: #4A5A50">New stop between 5 and 6 · adds 180 m to the walk</span>
    </div>
    <span style="font-size: 13px; font-weight: 600; color: #4A5A50">How should the question be made?</span>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="2">
        <button onClick="{{o.pick}}" style="{{o.style}}">
          <span style="display: flex; flex-direction: column; gap: 2px; text-align: left; flex-grow: 1">
            <span style="font-size: 16px; font-weight: 600">{{o.title}}</span>
            <span style="font-size: 13px; color: #4A5A50">{{o.sub}}</span>
          </span>
          <span style="{{o.radio}}"></span>
        </button>
      </sc-for>
    </div>
    <div style="flex-grow: 1"></div>
    <a href="StopEdit.dc.html" style="height: 56px; border-radius: 28px; background: {{accent}}; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px">{{cta}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F6F4A","options":["#1F6F4A","#1D4ED8","#B4471B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'ai' }; }
  renderVals() {
    const accent = this.props.accent ?? '#1F6F4A';
    const defs = [
      { id: 'ai', title: 'Suggest a question', sub: 'Written from this place’s history, matched to your topic' },
      { id: 'own', title: 'Write my own', sub: 'Type a question and up to 4 answers' }
    ];
    const options = defs.map((d) => {
      const on = d.id === this.state.mode;
      return {
        ...d,
        style: 'min-height: 72px; width: 100%; box-sizing: border-box; padding: 12px 16px; border-radius: 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-family: Inter, sans-serif; color: #16211B; ' + (on ? 'background: #E2F0E7; border: 2px solid ' + accent + ';' : 'background: #FFFFFF; border: 1px solid #C9D2C4;'),
        radio: 'width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 11px; ' + (on ? 'border: 7px solid ' + accent + '; background: #FFFFFF;' : 'border: 2px solid #8FA197;'),
        pick: () => this.setState({ mode: d.id })
      };
    });
    return { accent, options, cta: this.state.mode === 'ai' ? 'Suggest question' : 'Write question' };
  }
}
</script>
</body>
</html>
